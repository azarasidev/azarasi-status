<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>あざらしSMP サービス稼働状況</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; color: #1f2328; background: #f6f8fa;
         font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
         font-size: 14px; line-height: 1.6; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px 40px; }
  /* ヘッダー */
  .site-header { background: #16324f; color: #fff; }
  .site-header .wrap { padding-top: 18px; padding-bottom: 16px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .site-header h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: .02em; }
  .site-header .updated { font-size: 12px; color: #b9c9da; }
  .badge { display: inline-block; border: 1px solid #bf8700; color: #9a6700; background: #fff8c5;
           font-size: 11.5px; padding: 1px 8px; margin-top: 8px; }
  /* 全体ステータス */
  .overall { background: #fff; border: 1px solid #d0d7de; border-left: 5px solid #57606a; margin-top: 20px; padding: 14px 18px; }
  .overall .big { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 9px; }
  .overall .sub { color: #57606a; font-size: 12.5px; margin-top: 3px; }
  .overall.ok { border-left-color: #1a7f37; }
  .overall.partial { border-left-color: #bf8700; }
  .overall.down { border-left-color: #cf222e; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #57606a; flex-shrink: 0; }
  .dot.ok { background: #1a7f37; }
  .dot.partial { background: #bf8700; }
  .dot.down { background: #cf222e; }
  /* サービス一覧テーブル */
  .panel { background: #fff; border: 1px solid #d0d7de; margin-top: 16px; }
  .table-scroll { overflow-x: auto; }
  table.services { width: 100%; border-collapse: collapse; min-width: 640px; }
  table.services th, table.services td { padding: 10px 14px; text-align: left; vertical-align: middle; }
  table.services thead th { background: #f6f8fa; border-bottom: 1px solid #d0d7de; font-size: 12px; color: #57606a; font-weight: 600; white-space: nowrap; }
  table.services tbody tr { border-bottom: 1px solid #eaeef2; }
  table.services tbody tr:last-child { border-bottom: none; }
  .svc-name { font-weight: 600; white-space: nowrap; }
  .status { white-space: nowrap; font-weight: 600; }
  .status .dot { display: inline-block; width: 9px; height: 9px; margin-right: 6px; vertical-align: 1px; }
  .status.ok { color: #1a7f37; }
  .status.ng { color: #cf222e; }
  .status.unk { color: #57606a; }
  .num { white-space: nowrap; color: #1f2328; }
  .num .unit { color: #57606a; font-size: 12px; }
  .uptime-cell { min-width: 190px; }
  .uptime-head { display: flex; justify-content: space-between; font-size: 11.5px; color: #57606a; }
  .bar { display: flex; gap: 1px; margin-top: 4px; }
  .seg { flex: 1; height: 14px; background: #eaeef2; }
  .seg.full { background: #2da44e; }
  .seg.part { background: #d4a72c; }
  .seg.low { background: #cf222e; }
  .seg.none { background: #eaeef2; }
  /* お知らせ */
  .section-title { margin: 28px 0 0; font-size: 15px; font-weight: 700; padding-bottom: 6px; border-bottom: 2px solid #16324f; }
  .notice { background: #fff; border: 1px solid #d0d7de; padding: 12px 16px; margin-top: 10px; }
  .notice .nhead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .notice .kind { font-size: 11px; font-weight: 600; border: 1px solid #57606a; color: #57606a; padding: 0 7px; white-space: nowrap; }
  .notice.maintenance .kind { border-color: #bf8700; color: #9a6700; }
  .notice.incident .kind { border-color: #cf222e; color: #cf222e; }
  .notice .ntitle { font-weight: 700; font-size: 14px; }
  .notice .ndate { color: #57606a; font-size: 12px; }
  .notice .nbody { color: #1f2328; font-size: 13.5px; margin-top: 6px; line-height: 1.7; white-space: pre-wrap; }
  .empty { color: #57606a; padding: 16px 2px 0; font-size: 13px; }
  footer { color: #57606a; font-size: 12px; padding: 26px 0 4px; line-height: 1.9; border-top: 1px solid #d0d7de; margin-top: 30px; }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <h1>あざらしSMP サービス稼働状況</h1>
    <div>
      <div class="updated" id="updated">読み込み中…</div>
      <div id="demo"></div>
    </div>
  </div>
</header>
<div class="wrap">
<section class="overall unknown" id="banner">
  <div class="big"><span class="dot"></span>確認中</div>
  <div class="sub">状態を取得しています</div>
</section>
<main class="panel"><div class="table-scroll"><table class="services">
  <thead><tr><th>サービス</th><th>状態</th><th>プレイヤー</th><th>応答時間</th><th>稼働率（過去30日間）</th></tr></thead>
  <tbody id="cards"></tbody>
</table></div></main>
<h2 class="section-title">お知らせ</h2>
<section id="notices"></section>
<footer>
  接続先（Java版）: smp.azarasi.f5.si ／ 統合版: フレンド「AzarasiSRV」を追加して参加<br>
  本ページの稼働状況は5分ごとに自動で確認し、更新しています。
</footer>
</div>
<script>
// ===== デプロイ時に置換される接続先 =====
// 読み取り専用トークンなので、ページに埋め込んで公開しても問題ありません。
var UPSTASH_URL = 'https://eminent-dove-220114.upstash.io';
var UPSTASH_RO_TOKEN = 'ggAAAAAAA1vSAAIgcDLlQfyHuiXlZ4xv2G2JJXOMnTt51BsavfrbH2zgXv80ZQ';
var PUBLIC_KEY = 'azarasi-status-public';
var STALE_MS = 15 * 60 * 1000; // 15分以上前のデータは「確認中」扱い (Node 版と同じ)

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var OVERALL = {
  ok: ['全サービス正常稼働中', 'すべてのサービスが正常に稼働しています'],
  partial: ['一部障害発生中', '一部のサービスで障害が発生しています'],
  down: ['障害発生中', 'サービスが停止しています'],
  unknown: ['確認中', '状態を確認しています']
};
function segClass(pct) {
  if (pct === null || pct === undefined) return 'none';
  if (pct >= 99.9) return 'full';
  if (pct >= 50) return 'part';
  return 'low';
}

// ---- デモデータ (プレースホルダ未置換のときに表示。Node 版の demoData と同じ内容) ----
var JST_OFFSET = 9 * 3600 * 1000;
function jstDayKey(tsMs) { return new Date(tsMs + JST_OFFSET).toISOString().slice(0, 10); }
function dayKeyDaysAgo(n) { return jstDayKey(Date.now() - n * 24 * 3600 * 1000); }
function demoData() {
  var now = Date.now();
  var services = [
    { id: 'smp', name: 'あざらしSMP', online: true, players: 7, maxPlayers: 100, latencyMs: 23 },
    { id: 'lobby', name: 'ロビー', online: true, players: null, maxPlayers: null, latencyMs: 23 },
    { id: 'pvp', name: 'あざらしPvP', online: true, players: 3, maxPlayers: 100, latencyMs: 31 },
    { id: 'test', name: 'テスト鯖', online: true, players: 1, maxPlayers: 20, latencyMs: 4 },
    { id: 'external', name: '海外サーバーからの接続テスト', online: true, players: 7, maxPlayers: 2026, latencyMs: 350 },
    { id: 'smp_voice', name: 'SMP ボイスチャット', online: true, players: null, maxPlayers: null, latencyMs: 15 },
    { id: 'lobby_voice', name: 'ロビー ボイスチャット', online: true, players: null, maxPlayers: null, latencyMs: 15 },
    { id: 'test_voice', name: 'テスト鯖 ボイスチャット', online: true, players: null, maxPlayers: null, latencyMs: 18 },
    { id: 'site', name: '公式サイト', online: true, players: null, maxPlayers: null, latencyMs: 120 }
  ];
  var days = [];
  for (var i = 29; i >= 0; i--) {
    // 6日前だけ部分障害があった風のサンプル
    days.push({ date: dayKeyDaysAgo(i), pct: i === 6 ? 82.6 : 100 });
  }
  return {
    demo: true,
    checkedAt: new Date(now).toISOString(),
    stale: false,
    overall: 'ok',
    services: services.map(function(s) {
      var c = Object.assign({}, s); c.uptimePct30d = 99.7; c.days = days; return c;
    }),
    announcements: [
      { id: 'demo1', at: new Date(now - 2 * 3600 * 1000).toISOString(), kind: 'info', title: 'ステータスページを公開しました', body: '各サーバーの稼働状況をこのページで確認できます。（これはデモ表示です）' }
    ]
  };
}

function render(d) {
  document.getElementById('updated').textContent = d.checkedAt
    ? '最終確認: ' + new Date(d.checkedAt).toLocaleString('ja-JP') + (d.stale ? '（情報が古くなっています）' : '')
    : 'チェッカーからのデータ待ち';
  document.getElementById('demo').innerHTML = d.demo ? '<span class="badge">デモデータ表示中（チェッカー未接続）</span>' : '';
  var banner = document.getElementById('banner');
  var ov = OVERALL[d.overall] || OVERALL.unknown;
  banner.className = 'overall ' + (d.overall || 'unknown');
  banner.innerHTML = '<div class="big"><span class="dot ' + (d.overall || 'unknown') + '"></span>' + ov[0] + '</div><div class="sub">' + ov[1] + '</div>';
  document.getElementById('cards').innerHTML = d.services.map(function(s) {
    var chip, cls;
    if (d.stale || s.online === null || s.online === undefined) { chip = '確認中'; cls = 'unk'; }
    else if (s.online) { chip = '正常'; cls = 'ok'; }
    else { chip = '障害発生中'; cls = 'ng'; }
    var players = '<span class="num">—</span>';
    if (s.players !== null && s.players !== undefined) players = '<span class="num">' + s.players + (s.maxPlayers ? ' <span class="unit">/ ' + s.maxPlayers + ' 人</span>' : ' <span class="unit">人</span>') + '</span>';
    var latency = '<span class="num">—</span>';
    if (s.latencyMs !== null && s.latencyMs !== undefined) latency = '<span class="num">' + Math.round(s.latencyMs) + ' <span class="unit">ms</span></span>';
    var segs = (s.days || []).map(function(day) {
      return '<div class="seg ' + segClass(day.pct) + '" title="' + day.date + ': ' + (day.pct === null ? 'データなし' : day.pct + '%') + '"></div>';
    }).join('');
    var up = (s.uptimePct30d !== null && s.uptimePct30d !== undefined) ? s.uptimePct30d : s.uptimePct;
    return '<tr><td class="svc-name">' + esc(s.name) + '</td>' +
      '<td><span class="status ' + cls + '"><span class="dot ' + cls + '"></span>' + chip + '</span></td>' +
      '<td>' + players + '</td><td>' + latency + '</td>' +
      '<td class="uptime-cell"><div class="uptime-head"><span>30日間</span><span>' + (up === null || up === undefined ? '—' : up + '%') + '</span></div>' +
      '<div class="bar">' + segs + '</div></td></tr>';
  }).join('');
  var kindLabel = { info: 'お知らせ', maintenance: 'メンテナンス', incident: '障害情報' };
  var box = document.getElementById('notices');
  if (!d.announcements || d.announcements.length === 0) {
    box.innerHTML = '<div class="empty">お知らせはありません</div>';
  } else {
    box.innerHTML = d.announcements.map(function(a) {
      return '<article class="notice ' + esc(a.kind) + '"><div class="nhead">' +
        '<span class="kind">' + (kindLabel[a.kind] || 'お知らせ') + '</span>' +
        '<span class="ntitle">' + esc(a.title) + '</span>' +
        '<span class="ndate">' + new Date(a.at).toLocaleString('ja-JP') + '</span></div>' +
        (a.body ? '<div class="nbody">' + esc(a.body) + '</div>' : '') + '</article>';
    }).join('');
  }
}

function load() {
  // プレースホルダが残っている = まだデプロイ設定が済んでいないのでデモ表示
  if (UPSTASH_URL.indexOf('__UPSTASH') === 0 || UPSTASH_RO_TOKEN.indexOf('__UPSTASH') === 0) {
    render(demoData());
    return;
  }
  // 公開ドキュメントを Upstash REST から直接読む ({result: "文字列化JSON"} の二重パース)
  fetch(UPSTASH_URL.replace(/\/+$/, '') + '/get/' + PUBLIC_KEY, {
    headers: { Authorization: 'Bearer ' + UPSTASH_RO_TOKEN }
  }).then(function(r) { return r.json(); }).then(function(out) {
    if (!out || !out.result) throw new Error('empty result');
    var d = JSON.parse(out.result);
    d.demo = false;
    d.stale = !d.checkedAt || (Date.now() - Date.parse(d.checkedAt) > STALE_MS);
    if (d.stale) d.overall = 'unknown';
    render(d);
  }).catch(function() {
    document.getElementById('updated').textContent = '読み込みに失敗しました';
  });
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
